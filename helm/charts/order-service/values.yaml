replicaCount: 1
image:
  repository: platform/order-service
  tag: 1.0.0
  pullPolicy: IfNotPresent
containerPort: 8003
service:
  type: ClusterIP
  port: 8003
  name: http
configMapRef: platform-config
env:
- name: APP_ENV
  value: development
- name: DATABASE_URL
