    periodSeconds: 3
    failureThreshold: 30
  liveness:
    enabled: true
    path: /health/live
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    enabled: true
    path: /health/ready
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
