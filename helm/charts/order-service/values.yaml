  prometheus.io/scrape: 'true'
  prometheus.io/path: /metrics
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
serviceAccount:
  create: false
  name: ''
  automount: false
