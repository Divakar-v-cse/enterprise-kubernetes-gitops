apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: http://host.docker.internal:8099/enterprise-kubernetes-gitops.git
    targetRevision: main
    path: helm/charts/notification-service
    helm:
      releaseName: notification-service
      values: |
        replicaCount: 1
        image:
          tag: "1.0.0"
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=false]
