apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: git://host.docker.internal:9418/enterprise-kubernetes-gitops.git
    targetRevision: main
    path: helm/charts/user-service
    helm:
      releaseName: user-service
      values: |
        replicaCount: 1
        image:
          tag: "1.0.0"
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=false]

