apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Shared platform pieces deployed once, before the per-service Helm releases.
# Kept in their own directory so Argo CD can build it as a standalone
# kustomization (kustomize forbids referencing individual files outside root).
namespace: platform

resources:
  - configmap.yaml
  - postgres.yaml
  - platform-api.yaml
  - ingress.yaml
