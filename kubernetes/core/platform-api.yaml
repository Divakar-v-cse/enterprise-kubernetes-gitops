apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api
  namespace: platform
  labels:
    app.kubernetes.io/name: platform-api
automountServiceAccountToken: true
---
# Least privilege: read-only list/get across the resources the dashboard shows.
# No secrets, no writes, no exec, no wildcard verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-api-readonly
  labels:
    app.kubernetes.io/name: platform-api
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, services, events, persistentvolumeclaims, configmaps]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-api-readonly
  labels:
    app.kubernetes.io/name: platform-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-api-readonly
subjects:
  - kind: ServiceAccount
    name: platform-api
    namespace: platform
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: platform
  labels:
    app.kubernetes.io/name: platform-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: gitops-platform
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: platform-api
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: platform-api
          image: platform/platform-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: {name: platform-config}
          env:
            - name: IN_CLUSTER
              value: "true"
            - name: PLATFORM_DEMO_MODE
              value: "false"
            - name: PLATFORM_API_TOKEN
              valueFrom:
                secretKeyRef: {name: platform-secrets, key: PLATFORM_API_TOKEN}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 320Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: findings, mountPath: /app/security, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: findings
          configMap:
            name: security-findings
            optional: true
      terminationGracePeriodSeconds: 30
