apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: platform
  labels:
    app.kubernetes.io/name: product-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: product-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: platform
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: gitops-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: product-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: product-service
          image: platform/product-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef: {name: platform-config}
          env:
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef: {name: platform-secrets, key: INTERNAL_API_TOKEN}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: platform-secrets, key: POSTGRES_PASSWORD}
            - name: DATABASE_URL
              value: "postgresql+asyncpg://platform:$(POSTGRES_PASSWORD)@postgres:5432/products"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 320Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
