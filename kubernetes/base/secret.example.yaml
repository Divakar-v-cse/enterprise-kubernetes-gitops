# EXAMPLE ONLY - DO NOT COMMIT REAL VALUES.
#
# Create the real Secret out-of-band (never in Git):
#   kubectl -n platform create secret generic platform-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=INTERNAL_API_TOKEN="$(openssl rand -hex 24)" \
#     --from-literal=PUBLIC_API_KEY="$(openssl rand -hex 24)" \
#     --from-literal=PLATFORM_API_TOKEN="$(openssl rand -hex 24)"
#
# In production use External Secrets Operator / Sealed Secrets / SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: platform
  labels:
    app.kubernetes.io/part-of: gitops-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  INTERNAL_API_TOKEN: "REPLACE_ME"
  PUBLIC_API_KEY: "REPLACE_ME"
  PLATFORM_API_TOKEN: "REPLACE_ME"
