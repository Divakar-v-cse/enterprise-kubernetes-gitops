apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform

resources:
  - api-gateway.yaml
  - user-service.yaml
  - product-service.yaml
  - order-service.yaml
  - notification-service.yaml
  - frontend.yaml
  - ../policies

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: gitops-platform
      app.kubernetes.io/managed-by: kustomize

images:
  - name: platform/api-gateway
    newTag: 1.0.0
  - name: platform/user-service
    newTag: 1.0.0
  - name: platform/product-service
    newTag: 1.0.0
  - name: platform/order-service
    newTag: 1.0.0
  - name: platform/notification-service
    newTag: 1.0.0
  - name: platform/frontend
    newTag: 1.0.0
  - name: platform/platform-api
    newTag: 1.0.0

