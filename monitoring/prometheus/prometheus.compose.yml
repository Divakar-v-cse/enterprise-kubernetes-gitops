# Prometheus for the Docker Compose stack (service-level metrics only).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: compose-local

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8000"]
        labels: {service: api-gateway}
  - job_name: user-service
    static_configs:
      - targets: ["user-service:8001"]
        labels: {service: user-service}
  - job_name: product-service
    static_configs:
      - targets: ["product-service:8002"]
        labels: {service: product-service}
  - job_name: order-service
    static_configs:
      - targets: ["order-service:8003"]
        labels: {service: order-service}
  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:8004"]
        labels: {service: notification-service}
  - job_name: platform-api
    static_configs:
      - targets: ["platform-api:8080"]
        labels: {service: platform-api}
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
