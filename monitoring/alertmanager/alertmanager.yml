# Local Alertmanager. Alerts are visible in the UI at :9093 and are grouped by
# alertname/service. No external receiver is configured by default so the
# platform works offline; replace `ui-only` with a real receiver when available.
global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service", "namespace"]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
  receiver: ui-only
  routes:
    - matchers: ['severity="critical"']
      receiver: ui-only
      group_wait: 5s
      repeat_interval: 1h

receivers:
  - name: ui-only
    # Example wiring for later (requires a real endpoint):
    # webhook_configs:
    #   - url: http://notify.internal.example/alerts
    #     send_resolved: true

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ["service", "namespace"]
