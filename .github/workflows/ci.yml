name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint & static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install "ruff>=0.6,<1.0"
      - name: Ruff
        run: ruff check applications platform-api tools tests
      - name: Python syntax (compileall)
        run: python -m compileall -q applications platform-api tools

  test:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - applications/api-gateway
          - applications/user-service
          - applications/product-service
          - applications/order-service
          - applications/notification-service
          - platform-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          python -m pytest -q --junitxml=../../reports/junit-${{ strategy.job-index }}.xml \
            --cov=app --cov-report=term-missing --cov-fail-under=60
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ strategy.job-index }}
          path: reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: applications/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: applications/frontend/dist
          retention-days: 7

  manifests:
    name: Kubernetes & Helm validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Install kubeconform + kustomize
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform && sudo mv kubeconform /usr/local/bin/
          curl -sSLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz
          tar xzf kustomize.tar.gz && sudo mv kustomize /usr/local/bin/
      - name: Render kustomize overlays
        run: |
          mkdir -p rendered
          kustomize build kubernetes/overlays/development > rendered/development.yaml
          kustomize build kubernetes/overlays/production  > rendered/production.yaml
          kustomize build monitoring > rendered/monitoring.yaml
          kustomize build logging > rendered/logging.yaml
      - name: kubeconform (strict)
        run: |
          kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/
      - name: helm lint
        run: |
          helm lint helm/microservice
          for chart in helm/charts/*/; do helm lint "$chart"; done
      - name: helm template
        run: |
          mkdir -p rendered-helm
          for chart in helm/charts/*/; do
            name=$(basename "$chart")
            helm template "$name" "$chart" --namespace platform > "rendered-helm/$name.yaml"
          done
          kubeconform -strict -summary -kubernetes-version 1.31.0 rendered-helm/
      - name: docker compose config
        run: docker compose config --quiet

  docker-build:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [test, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            dockerfile: applications/api-gateway/Dockerfile
          - image: user-service
            dockerfile: applications/user-service/Dockerfile
          - image: product-service
            dockerfile: applications/product-service/Dockerfile
          - image: order-service
            dockerfile: applications/order-service/Dockerfile
          - image: notification-service
            dockerfile: applications/notification-service/Dockerfile
          - image: platform-api
            dockerfile: docker/platform-api.Dockerfile
          - image: frontend
            dockerfile: applications/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push on PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            APP_VERSION=${{ github.sha }}
