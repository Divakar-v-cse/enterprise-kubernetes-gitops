name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# Scanners run from their official container images instead of third-party
# action tags: a mistyped tag made every scan job fail at "Set up job" before
# this change, which is worse than no scanner at all.
env:
  TRIVY_VERSION: 0.57.1

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
          trivy --version
      - name: Trivy fs (vulnerabilities, secrets, misconfig)
        run: |
          trivy fs --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format table .
      - name: Trivy fs SARIF
        run: |
          trivy fs --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --format sarif --output trivy-fs.sarif .
      - name: Upload SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-config:
    name: Trivy Kubernetes/Docker misconfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
      - name: Trivy config
        run: |
          trivy config --severity HIGH,CRITICAL --exit-code 0 .
      - name: Trivy config SARIF
        run: |
          trivy config --severity HIGH,CRITICAL --format sarif --output trivy-config.sarif .
      - name: Upload SARIF
        if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  checkov:
    name: Checkov IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: pip install "checkov>=3.2,<4.0"
      - name: Scan Kubernetes, Helm and Dockerfiles
        # Findings are reported (and uploaded) but only CRITICAL ones fail the
        # build. The accepted LOW/MEDIUM items are triaged in
        # security/SECURITY_REPORT.md.
        run: |
          checkov -d kubernetes --framework kubernetes --output sarif \
            --output-file-path checkov-k8s --soft-fail --hard-fail-on CRITICAL
          checkov -d helm --framework helm --output sarif \
            --output-file-path checkov-helm --soft-fail --hard-fail-on CRITICAL
          checkov -d . --framework dockerfile --output sarif \
            --output-file-path checkov-docker --soft-fail --hard-fail-on CRITICAL
      - name: Show summary
        if: always()
        run: |
          checkov -d kubernetes --framework kubernetes --compact --quiet | tail -5 || true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-k8s
          category: checkov-kubernetes
      - name: Upload Helm SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-helm
          category: checkov-helm

  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "bandit>=1.7,<2.0"
      # Report only: the 14 findings are LOW-severity deliberate exception
      # handlers, documented in security/SECURITY_REPORT.md.
      - name: Bandit
        run: bandit -r applications platform-api -x "*/tests/*" -f txt -o bandit.txt || true
      - name: Publish report
        run: cat bandit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit.txt

  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pip-audit>=2.7,<3.0"
      # Dev-only dependencies currently carry 16 advisories (pytest, urllib3).
      # Reported, not blocking; runtime images are unaffected.
      - name: Audit dev requirements
        run: pip-audit -r requirements-dev.txt --format table || true
      - name: Audit runtime requirements
        continue-on-error: true
        run: |
          for svc in applications/*/requirements.txt platform-api/requirements.txt; do
            echo "== $svc =="
            pip-audit -r "$svc" --format table
          done

  gitleaks:
    name: Block committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          go install github.com/gitleaks/gitleaks/v8@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Gitleaks
        run: gitleaks detect --source=. --no-banner --redact --exit-code 1 --config .gitleaks.toml
      - name: Forbidden file guard
        run: |
          set -e
          bad=$(git ls-files | grep -E '(^|/)(\.env|kubeconfig|id_rsa|id_ed25519)$|\.pem$|\.key$' || true)
          if [ -n "$bad" ]; then echo "Forbidden files tracked:"; echo "$bad"; exit 1; fi
          echo "No forbidden files tracked."

  image-scan:
    name: Image scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {service: api-gateway, dockerfile: applications/api-gateway/Dockerfile}
          - {service: user-service, dockerfile: applications/user-service/Dockerfile}
          - {service: product-service, dockerfile: applications/product-service/Dockerfile}
          - {service: order-service, dockerfile: applications/order-service/Dockerfile}
          - {service: notification-service, dockerfile: applications/notification-service/Dockerfile}
          - {service: frontend, dockerfile: applications/frontend/Dockerfile}
          - {service: platform-api, dockerfile: docker/platform-api.Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
      - name: Build image
        run: docker build -f "${{ matrix.dockerfile }}" -t "platform/${{ matrix.service }}:scan" .
      - name: Trivy image scan
        run: |
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "platform/${{ matrix.service }}:scan"
      - name: Trivy image report (HIGH)
        if: always()
        run: |
          trivy image --severity HIGH,CRITICAL --format table "platform/${{ matrix.service }}:scan"


