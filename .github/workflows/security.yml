name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy-fs:
    name: Trivy filesystem & config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (vulnerabilities, secrets)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
      - name: Trivy SARIF
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          scanners: vuln,secret,misconfig
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  trivy-config:
    name: Trivy Kubernetes/Docker misconfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

  checkov:
    name: Checkov IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "checkov>=3.2,<4.0"
      - name: Scan Kubernetes, Helm and Dockerfiles
        run: |
          checkov -d kubernetes --framework kubernetes --output cli --output sarif --output-file-path checkov-k8s
          checkov -d helm --framework helm --output cli --output sarif --output-file-path checkov-helm
          checkov -d applications --framework dockerfile --output cli
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-k8s/results_sarif.json

  image-scan:
    name: Image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            dockerfile: applications/api-gateway/Dockerfile
          - image: user-service
            dockerfile: applications/user-service/Dockerfile
          - image: product-service
            dockerfile: applications/product-service/Dockerfile
          - image: order-service
            dockerfile: applications/order-service/Dockerfile
          - image: notification-service
            dockerfile: applications/notification-service/Dockerfile
          - image: platform-api
            dockerfile: docker/platform-api.Dockerfile
          - image: frontend
            dockerfile: applications/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image for scanning
        run: docker build -f ${{ matrix.dockerfile }} -t local/${{ matrix.image }}:${{ github.sha }} .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/${{ matrix.image }}:${{ github.sha }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library

  secrets:
    name: Block committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if forbidden files are tracked
        run: |
          set -e
          forbidden=$(git ls-files | grep -E '(^|/)(\.env($|\.)|kubeconfig|.*\.pem|.*\.key)$' || true)
          if [ -n "$forbidden" ]; then
            echo "Forbidden files tracked:"; echo "$forbidden"; exit 1
          fi
          echo "No forbidden secret-bearing files tracked."
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
