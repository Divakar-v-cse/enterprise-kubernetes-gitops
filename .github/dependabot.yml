version: 2
# Grouped updates keep pull-request noise (and red PR checks) manageable.
# Major framework jumps (TypeScript 7, Vite 8, React 19) are ignored until the
# upgrade is planned: they break the pinned Rollup/build toolchain and are not
# security-driven.
updates:
  - package-ecosystem: pip
    directory: "/applications/user-service"
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      python-minor:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: "/platform-api"
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      python-minor:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/applications/frontend"
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/applications/api-gateway"
    schedule: {interval: monthly}
